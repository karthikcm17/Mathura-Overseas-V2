# ============ JEKYLL SETTINGS — Mathura Overseas ============
# GitHub Pages reads this file automatically and assembles every page from the pieces in _includes/.
# You rarely need to touch it. If you change it while previewing on your computer, stop (Ctrl+C) and
# run "jekyll serve" again — this one file is not reloaded automatically.

title: Mathura Overseas
# The live address. Used by sitemap.xml so Google gets full links. No slash at the end.
url: "https://mathuraoverseas.com"

# ANDROID APP — the "Get the app" links (footer badge on computers, phone menu, Android install banner).
# Leave it EMPTY ("") until Google approves the app for production: everything stays hidden
# (the links only appear when this holds a real play.google.com address).
# On approval day:
#   1. Paste the Play Store link between the quotes (exactly this form, with ?id=):
#        play_store_url: "https://play.google.com/store/apps/details?id=com.mathuraoverseas.app"
#   2. Download Google's official badge (play.google.com/intl/en_us/badges → the SVG with no padding)
#      and save it as  assets/images/app/google-play-badge.svg  (Google requires its badge unaltered).
#   3. Stop and restart "jekyll serve" (this file is only read at start), then commit and push.
play_store_url: ""

# Pages are plain HTML documents: never wrap them in a theme layout.
defaults:
  - scope:
      path: ""
    values:
      layout: null

# Folders Jekyll would skip because their name starts with a dot, but that MUST be published.
# .well-known/assetlinks.json proves to Android that the Play Store app and this website belong together.
# Without this line the app opens with a browser address bar on top.
include:
  - .well-known

# Files that live in the repository but must NOT be published on the website.
exclude:
  - PAGE_TEMPLATE.html          # starting point for new pages, not a real page
  - bottom-nav-snippet.html     # old copy-paste snippet, replaced by _includes/bottom-nav.html
  - mbbs-in-central-america.html  # replaced by mbbs-in-caribbean.html; delete the file when you are ready
  - README.md
  - JEKYLL_SETUP.md
  - SITE_CONTENT_PLAN.md
  - IMAGE_BRIEF.md
  - COUNTRY_PAGES_PLAN.md
  - GO_LIVE_CHECKLIST.md
  - ANDROID_APP_SETUP.md
  - PUSH_SETUP.md
  - google-sheets-lead-script.gs
  - worker                      # the Ask Mathura AI Worker runs on Cloudflare, not on the website
  - ASK_MATHURA_SETUP.md
  - claude
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
