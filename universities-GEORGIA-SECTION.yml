# ---------------- GEORGIA (every university has its own page) ----------------
# Fees = tuition a year, 2026–27, checked Nov 2026 across several published fee tables;
# TMA and GAU are the universities' own published fees.
- name: Petre Shotadze Tbilisi Medical Academy (TMA)
  country: georgia
  city: Tbilisi
  badge: Private · medicine only
  facts:
    - Founded in 1992 by the paediatric surgeon Petre Shotadze
    - A six-year MD taught in English
  fee: "₹6.7 L"
  fee_note: tuition a year (US$7,000, published by TMA)
  page: mbbs-in-georgia-tbilisi-medical-academy.html
  image: assets/images/universities/tma/spotlight.webp
  aka: TMA, Shotadze, Tbilisi Medical Academy

- name: David Tvildiani Medical University
  country: georgia
  city: Tbilisi
  badge: Private
  facts:
    - Began as AIETI Medical School; its MD is accredited by NCEQE until 2028
    - A curriculum built around the US licensing exam (USMLE)
  fee: "₹5.7 L"
  fee_note: tuition a year (about US$6,000)
  page: mbbs-in-georgia-david-tvildiani-medical-university.html
  image: assets/images/universities/dtmu/card.webp
  aka: DTMU, AIETI, Tvildiani

