<!-- ============ APP WELCOME / LAUNCH SCREEN (_includes/app-welcome.html) — included by footer.html on every page.
     Inside the app only (phone or computer), never on the website. js/push.js chooses the version:
       · FIRST opening ever: what the app offers + "Turn on alerts" / "Not now" (no timer: it's a real choice).
       · Every later opening from the app icon: a greeting, the LATEST UPDATE and the NEXT COUNSELLING DATE
         (read live from your two data files), the "Start my journey" button (opens the app at once), and
         under it a small "Opening in 5s" countdown that opens the app by itself. Touching a row stops it.
         Skipped when the app is opened from a notification or a long-press shortcut: straight to that page.
     The three FIRST-opening rows can be edited freely. -->
<div class="app-welcome" id="appWelcome" role="dialog" aria-modal="true" aria-labelledby="appWelcomeTitle" hidden>
  <div class="app-welcome__glow" aria-hidden="true"></div>
  <div class="app-welcome__inner">
    <div class="app-welcome__mark" aria-hidden="true">
      <svg class="app-welcome__orbit" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92"/><circle class="app-welcome__dot" cx="100" cy="8" r="5"/><circle class="app-welcome__dot app-welcome__dot--soft" cx="100" cy="192" r="3.5"/></svg>
      <span class="app-welcome__logo"><svg viewBox="0 0 40 40"><g class="app-welcome__cap"><path d="M20 9 7 15.5 20 22l13-6.5L20 9Z"/><path d="M12 19.2V24c0 2.2 3.6 4 8 4s8-1.8 8-4v-4.8L20 24.4l-8-5.2Z" opacity=".92"/></g><path d="M33 16v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="33" cy="25" r="1.9"/></svg></span>
    </div>
    <p class="app-welcome__hello" data-welcome-hello>Welcome to</p>
    <h2 class="app-welcome__title" id="appWelcomeTitle">Mathura Overseas</h2>
    <p class="app-welcome__lead" data-welcome-lead>Your MBBS abroad journey, all in one app.</p>
    <ul class="app-welcome__list" data-welcome-first>
      <li><span class="icon-badge icon-badge--sm icon-badge--orange"><svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg></span><span><b>Instant alerts</b>NEET updates &amp; counselling dates</span></li>
      <li><span class="icon-badge icon-badge--sm icon-badge--teal"><svg class="icon" aria-hidden="true"><use href="#i-check-square"></use></svg></span><span><b>MBBS Planner</b>Eligibility, budget &amp; compare</span></li>
      <li><span class="icon-badge icon-badge--sm icon-badge--pink"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg></span><span><b>Real counsellors</b>Free guidance, one tap away</span></li>
    </ul>
    <ul class="app-welcome__list app-welcome__live" data-welcome-live hidden><li class="is-skeleton"></li><li class="is-skeleton"></li><li class="is-skeleton"></li></ul>
    <div class="app-welcome__actions">
      <button type="button" class="btn btn--ondark btn--block app-welcome__allow" data-welcome-allow><svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg><span>Turn on alerts</span></button>
      <button type="button" class="btn btn--ondark btn--block app-welcome__go" data-welcome-go hidden><span>Start my journey</span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
      <button type="button" class="app-welcome__skip" data-welcome-skip>Not now</button>
      <button type="button" class="app-welcome__auto" data-welcome-auto hidden><span class="app-welcome__auto-bar" aria-hidden="true"><i></i></span><span data-welcome-count>Opening in 5s</span></button>
    </div>
  </div>
</div>
<!-- Chooses the version before the screen is drawn (no flash of the wrong words). js/push.js does the rest. -->
<script>(function(){var h=document.documentElement,w=document.getElementById('appWelcome');if(!w||!h.classList.contains('app-launch'))return;var first=true;try{first=!localStorage.getItem('mo-welcome')}catch(e){}if(first)return;w.classList.add('is-launch');var r=new Date().getHours();w.querySelector('[data-welcome-hello]').textContent=r<12?'Good morning':r<17?'Good afternoon':'Good evening';w.querySelector('[data-welcome-lead]').textContent='Here\u2019s what\u2019s new today.'})();</script>
