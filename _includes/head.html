<!-- ============ SHARED <head> LINES (_includes/head.html) — fonts, the shared CSS files and app settings.
     Add or remove a SHARED stylesheet here once and every page follows. Page-only CSS stays in each page's own <head>.
     Each page still writes its own <title>, description, canonical and og: lines (they differ per page).
     A page that must stay out of Google (e.g. 404.html) adds   noindex: true   to its top block. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<!-- App launch animation: decided here, before anything is drawn, so the page never flashes first.
     Runs once per app opening from the app icon (home page) — not on page changes, not when opened from a
     notification or a shortcut. js/pwa.js / js/push.js end it. The 4 s timer is only a safety net. -->
<script>(function(){try{var h=document.documentElement,q=location.search,a=q.indexOf('source=app')>-1||matchMedia('(display-mode: standalone)').matches,home=/\/(index\.html)?$/.test(location.pathname)&&q.indexOf('source=push')<0;if(a&&!sessionStorage.getItem('mo-launched')){sessionStorage.setItem('mo-launched','1');if(home){h.classList.add('app-launch');setTimeout(function(){h.classList.remove('app-launch')},4000)}}}catch(e){}})();</script>
