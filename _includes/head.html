<!-- ============ SHARED <head> LINES (_includes/head.html) — fonts, the shared CSS files and app settings.
     Add or remove a SHARED stylesheet here once and every page follows. Page-only CSS stays in each page's own <head>.
     Each page still writes its own <title>, description, canonical and og: lines (they differ per page).
     A page that must stay out of Google (e.g. 404.html) adds   noindex: true   to its top block. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mathura Overseas">
<meta name="format-detection" content="telephone=no">
{% if page.noindex %}<meta name="robots" content="noindex, follow">
{% endif %}<meta property="og:type" content="website">
<meta property="og:site_name" content="Mathura Overseas">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/images/favicon.png" sizes="32x32">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% if include.font == "async" %}<!-- Font: one variable file (all weights), loaded without blocking the first paint -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet"></noscript>
{% else %}<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% endif %}<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
