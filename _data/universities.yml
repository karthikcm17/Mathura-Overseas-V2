# ============ UNIVERSITIES — ONE LIST FOR THE WHOLE SITE (_data/universities.yml) ============
# Every university we recommend lives here ONCE. The Universities page (mbbs-universities.html) builds its
# cards, search and filters from this list automatically, so a new university needs no HTML at all.
#
# TO ADD A UNIVERSITY: copy one entry (from "- name:" down to its "aka:" line), paste it under the same
# country, and change the values. Keep the two spaces at the start of each line exactly as they are.
#
#   name       full name, as on the country page
#   country    must match a "slug" in _data/countries.yml (e.g. philippines, russia)
#   city       shown under the name
#   badge      the short label on the card (e.g. Government, Private, Mathura students here)
#   facts      one or two short lines. Phones show the first; computers show both.
#   fee        OPTIONAL. Only a figure you have confirmed, e.g. "₹3.3 L". Leave the line out if unsure.
#   fee_note   what the fee means, e.g. "tuition a year (US$3,500)" or "full course"
#   page       OPTIONAL. The university's own fee page. Leave the line out until that page exists;
#              the card then offers "Get the fee sheet" on WhatsApp instead.
#   image      the photo. Same file the country page uses, so you only upload it once.
#   aka        other names and short forms people search for (KSMA, Akhunbaev…). Not shown on the page.
#
# Everything below is copied from the country pages (as of Oct 2026). Fees use 1 USD = ₹95 (26 Oct 2026).

