# ============ COUNTRIES — one entry per country page (_data/countries.yml) ============
# The Countries page (destinations.html) builds EVERYTHING country-related from this file:
# the "a year, all-in" chart, the "Fly the route from Chennai" explorer, the country chips and the
# country headings above each group of universities. The ORDER here is the order shown on the site.
# To add a country: copy one whole entry (from "- slug:" to the last "why" line) and change the values.
#
#   slug        short id, lowercase. Every university in _data/universities.yml points to one of these.
#   name        shown on the site
#   page        the country page
#   planner     OPTIONAL. The country's id in the MBBS Planner, only if it differs from slug (Timor-Leste = timor)
#   year_cost   the "average year, all-in" figure from the country page, as text
#   year_inr    the same figure as a plain number of rupees (sizes the bar in the chart)
#   duration    course length, short
#   ---- the flight explorer ----
#   airport     3-letter code of the arrival airport (MNL, TAS…)
#   city        the arrival city
#   hours       flight time from Chennai as shown, e.g. "~10" or "9–10"
#   hours_num   the same as one number (sizes the "share of a day" bar; 9–10 → 9.5)
#   stops       e.g. "1 stop" or "via Singapore"
#   fare        lowest one-way fare seen from Chennai, as text      fare_as_of: when you checked it
#   time        time difference with India
#   money       exchange rate, as text                              money_as_of: when you checked it
#   language    local language(s)
#   climate     one short line
#   why         exactly three short reasons, from the country page
#
# Every value below is copied from that country's own page (flight panel, "at a glance" band, fees and
# "why" cards), as of Sep–Oct 2026. When you update a country page, update its entry here too.

